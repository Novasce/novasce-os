# Novasce OS · configuração dos apps da casa (M3). Pública: nada aqui é segredo.
# Reforço por máquina em /etc/novasce/apps.toml, chave por chave.
[github]
# Client ID do OAuth App "Novasce OS" (público), da org Novasce, com o Device Flow ligado e sem client secret.
# Vazio: o passo 3 do Começar explica e oferece pular.
client_id = "Ov23lil1GHiTVX5aNZoM"

[brain]
# Repositório-modelo da Novasce Base (privado, membro da org lê). Vazio ou inacessível: o brain nasce vazio, com README e AGENTS.md.
modelo = "Novasce/brain-base"

[google]
# Preenchidos na montagem pelas variáveis NOVASCE_GOOGLE_CLIENT_ID e NOVASCE_GOOGLE_CLIENT_SECRET do Actions.
# Vazios: o rclone usa o cliente padrão dele.
client_id = ""
client_secret = ""
pasta = "Novasce OS/Documentos"

[voz]
qualquer_campo = true
limite_toque_ms = 350

[sede]
conta = "sede"
titulo_sala = "Sala da Novasce"
volta_minutos = 10
contagem_segundos = 30
tranca_minutos = 5
