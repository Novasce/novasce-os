name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        run: |
          shellcheck build_files/*.sh tests/*.sh .github/scripts/*.sh \
            system_files/usr/libexec/novasce/* system_files/usr/bin/novasce-primeiro-uso
      - name: versão do dia
        run: bash tests/versao.test.sh

  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: libdbus para o ksni e o keyring (M3)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  preparar-tauri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: dependências do Tauri no Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build -w apps/preparar
      - run: cargo test --locked --manifest-path apps/preparar/src-tauri/Cargo.toml

  m3-tauri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: dependências do Tauri, da camada e do D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-layer-shell-dev libdbus-1-dev
      - run: npm ci
      - name: os quatro apps compilam e testam
        run: |
          for a in comecar ajuda voz sede; do
            npm run build -w "apps/$a"
            cargo test --locked --manifest-path "apps/$a/src-tauri/Cargo.toml"
          done

  m3-extra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guia do Novasce OS gera sem travessão
        run: npm run guia -w ajuda -- --versao v1 --data 01/01/2026
      - name: sem travessão nos textos de tela
        run: |
          if grep -rn $'\xe2\x80\x94' apps/*/src ajuda/conteudo ajuda/guia system_files/usr/share/novasce; then
            echo "Tem travessão em texto de tela"; exit 1
          fi
      - name: geometria (Playwright)
        working-directory: tests/geometria
        run: npm install && npx playwright install --with-deps chromium && npx playwright test
