[workspace]
resolver = "2"
members = ["crates/novasce-core", "crates/novasce-sinal", "crates/novasce-helper", "crates/novasce-casa", "crates/novasce-sinal-local", "crates/novasce-chamados", "crates/novasce-comecar", "crates/novasce-sincronizar"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
novasce-core = { path = "crates/novasce-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
mockito = "1.7"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
