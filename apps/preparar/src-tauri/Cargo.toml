[package]
name = "novasce-preparar"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
novasce-core = { path = "../../../rust/crates/novasce-core" }

[profile.release]
lto = "thin"
strip = true

# Workspace próprio: o app não entra no workspace de rust/.
[workspace]
