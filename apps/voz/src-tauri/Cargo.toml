[package]
name = "novasce-voz-app"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "novasce_voz_app"
path = "src/lib.rs"

[[bin]]
name = "novasce-voz"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
futures-util = "0.3"
novasce-casa = { path = "../../../rust/crates/novasce-casa" }
novasce-voz = { path = "../../../rust/crates/novasce-voz" }
novasce-camada = { path = "../../../rust/crates/novasce-camada", features = ["gtk"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
ksni = "0.2"
gtk = "0.18"

[profile.release]
lto = "thin"
strip = true

# Workspace próprio, como o Preparar do M1: o app não entra no workspace de rust/.
[workspace]
