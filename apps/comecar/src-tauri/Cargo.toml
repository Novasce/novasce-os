[package]
name = "novasce-comecar-app"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "novasce_comecar_app"
path = "src/lib.rs"

[[bin]]
name = "novasce-comecar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
novasce-casa = { path = "../../../rust/crates/novasce-casa" }
novasce-comecar = { path = "../../../rust/crates/novasce-comecar" }

[profile.release]
lto = "thin"
strip = true

# Workspace próprio, como o Preparar do M1: o app não entra no workspace de rust/.
[workspace]
