[package]
name = "novasce-sede-app"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "novasce_sede_app"
path = "src/lib.rs"

[[bin]]
name = "novasce-sede"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
novasce-casa = { path = "../../../rust/crates/novasce-casa" }
novasce-sede = { path = "../../../rust/crates/novasce-sede" }
novasce-camada = { path = "../../../rust/crates/novasce-camada", features = ["gtk"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
lto = "thin"
strip = true

# Workspace próprio, como o Preparar do M1: o app não entra no workspace de rust/.
[workspace]
